name: Proof of Concept using Typst

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-cv:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Install KoPubWorld fonts
        run: |
          sudo mkdir -p /usr/local/share/fonts/truetype/kopubworld
          KOPUB_BASE="https://raw.githubusercontent.com/adrinerDP/font-kopubworld/master/fonts"
          for f in KoPubWorld-Batang-Light.otf KoPubWorld-Batang-Medium.otf KoPubWorld-Batang-Bold.otf; do
            sudo curl -fsSL -o "/usr/local/share/fonts/truetype/kopubworld/$f" "$KOPUB_BASE/$f"
          done
          sudo fc-cache -fv

      - name: Create directory for artifacts
        run: mkdir -p ${{ github.workspace }}/artifacts

      - name: Compile CV
        run: |
          typst compile --root . exporter/typst/main.typ ${{ github.workspace }}/artifacts/PngWnA.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PngWnA.pdf
          path: ${{ github.workspace }}/artifacts/PngWnA.pdf
