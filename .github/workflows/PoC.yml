name: Proof of Concept using Typst

on:
  push:
    paths:
      - 'CV/*.yaml'
  workflow_dispatch:

jobs:
  compile-cv:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile CV
        run: |
          typst compile --root . exporter/typst/main.typ

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: main.pdf
          path: artifacts/PngWnA.pdf
